{% extends "base.html" %}

{% block content %}
<div class="column is-8 is-offset-2">
  <div class="box">
    <h3 class="title is-4 has-text-centered">Signature Verification</h3>
    
    <div class="notification is-info">
      <p><strong>Beneficiary Code:</strong> {{ code }}</p>
      {% if distribution_name %}
      <p><strong>Distribution:</strong> {{ distribution_name }}</p>
      {% endif %}
      <p><strong>Received Date:</strong> {{ received_when if received_when else 'Not available' }}</p>
    </div>
    
    <div class="field">
      <label class="label has-text-centered">Digital Signature:</label>
      <div class="has-text-centered" style="background-color: white; padding: 20px; border-radius: 5px; border: 2px solid #dbdbdb;">
        <img src="{{ signature_data }}" alt="Recipient Signature" style="max-width: 100%; max-height: 300px; height: auto; border: 1px solid #ccc; border-radius: 3px;">
      </div>
    </div>
    
    <div class="field is-grouped is-grouped-centered">
      <div class="control">
        <button onclick="window.print()" class="button is-primary">
          <span class="icon">
            <i class="fas fa-print"></i>
          </span>
          <span>Print</span>
        </button>
      </div>
      <div class="control">
        <a href="#" onclick="downloadSignature()" class="button is-info">
          <span class="icon">
            <i class="fas fa-download"></i>
          </span>
          <span>Download</span>
        </a>
      </div>
      <div class="control">
        <a href="javascript:history.back()" class="button is-light">Back</a>
      </div>
    </div>
  </div>
</div>

<script>
function downloadSignature() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    
    img.onload = function() {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        
        // Create download link
        const link = document.createElement('a');
        link.download = 'signature_{{ code }}.png';
        link.href = canvas.toDataURL();
        link.click();
    };
    
    img.src = '{{ signature_data }}';
}

// Print styles
const style = document.createElement('style');
style.textContent = `
    @media print {
        .navbar, .button, .field.is-grouped { display: none !important; }
        .box { box-shadow: none !important; border: 1px solid #000 !important; }
        .title { color: #000 !important; }
        .notification { background-color: #f5f5f5 !important; color: #000 !important; }
    }
`;
document.head.appendChild(style);
</script>

<style>
@media screen and (max-width: 768px) {
    .column.is-8.is-offset-2 {
        margin: 0;
        padding: 1rem;
    }
    
    .box {
        margin: 0;
    }
}
</style>
{% endblock %}
